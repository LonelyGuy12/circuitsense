services:
  # Unified Backend & Frontend Web Service
  - type: web
    name: circuitsense
    env: python
    buildCommand: "./build.sh"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: NVIDIA_API_KEY
        sync: false # Render will prompt you to enter this securely
