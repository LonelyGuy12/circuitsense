services:
  # Backend: Python FastAPI Service
  - type: web
    name: circuitsense-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: NVIDIA_API_KEY
        sync: false # Render will prompt you to enter this securely in their dashboard

  # Frontend: React Vite Static Site
  - type: web
    name: circuitsense-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: circuitsense-backend
          envVarKey: RENDER_EXTERNAL_URL
    # Rewrite all unmatched requests to index.html so React Router works correctly
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
